<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slip Markdown Slides</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar">
        <div class="brand">
          <strong>Slip</strong>
          <span id="deck-title">Untitled deck</span>
        </div>
        <div class="toolbar-actions">
          <label class="file-button">
            Import
            <input id="import-file" type="file" accept=".md,.markdown,text/markdown,text/plain">
          </label>
          <button id="export-md" type="button">Export MD</button>
          <button id="auto-split" type="button">Auto Split</button>
          <button id="custom-css-toggle" type="button">CSS</button>
          <button id="print-pdf" type="button">Print / PDF</button>
          <div class="present-menu">
            <button id="present-menu-button" type="button" aria-haspopup="true" aria-expanded="false">Present</button>
            <div id="present-menu-options" class="present-menu-options" hidden>
              <button id="present-mirror" type="button">Mirror Mode</button>
              <button id="present-speaker" type="button">Presenter Mode</button>
            </div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside class="outline" aria-label="Slide outline">
          <div class="panel-title">Slides</div>
          <ol id="outline-list"></ol>
        </aside>

        <section class="editor-pane" aria-label="Markdown editor">
          <div class="pane-header">
            <span>Markdown</span>
            <select id="theme-picker" aria-label="Theme">
              <option value="clean">Clean</option>
              <option value="contrast">Contrast</option>
              <option value="paper">Paper</option>
            </select>
            <select id="size-picker" aria-label="Slide size">
              <option value="widescreen">16:9</option>
              <option value="a4">A4</option>
            </select>
          </div>
          <div id="editor"></div>
          <div id="status" class="status" aria-live="polite"></div>
        </section>

        <section class="preview-pane" aria-label="Slide preview">
          <div class="pane-header">
            <span>Preview</span>
            <label class="notes-toggle">
              <input id="show-notes" type="checkbox">
              Notes
            </label>
          </div>
          <div id="preview" class="preview"></div>
        </section>
      </main>
    </div>

    <section id="custom-css-panel" class="custom-css-panel" aria-label="Custom slide CSS" hidden>
      <div class="custom-css-header">
        <h2>Slide CSS</h2>
        <button id="custom-css-close" type="button" aria-label="Close custom CSS panel">Close</button>
      </div>
      <textarea id="custom-css-editor" spellcheck="false"></textarea>
      <p id="custom-css-status" class="custom-css-status" aria-live="polite"></p>
    </section>

    <section id="auto-split-dialog" class="dialog-backdrop" aria-label="Review auto split" hidden>
      <div class="dialog">
        <header class="dialog-header">
          <h2>Review Split</h2>
          <button id="auto-split-cancel" type="button" aria-label="Cancel auto split">Cancel</button>
        </header>
        <div class="dialog-body">
          <p id="auto-split-summary" class="dialog-summary"></p>
          <ol id="auto-split-list" class="split-review-list"></ol>
        </div>
        <footer class="dialog-footer">
          <button id="auto-split-accept" type="button">Accept Split</button>
        </footer>
      </div>
    </section>

    <div id="presentation" class="presentation presentation-presenter" hidden>
      <button id="exit-present" class="exit-present" type="button" aria-label="Exit presentation">Exit</button>
      <div class="presentation-stage">
        <article id="presentation-slide" class="presentation-slide"></article>
        <aside class="presentation-side" aria-label="Presenter details">
          <div class="presentation-meta">
            <span id="presentation-count"></span>
            <span id="presentation-timer">00:00</span>
          </div>
          <section class="presentation-next-panel">
            <h2>Next</h2>
            <div id="presentation-next" class="presentation-next"></div>
          </section>
          <section class="presentation-notes-panel">
            <h2>Notes</h2>
            <div id="presentation-notes"></div>
          </section>
        </aside>
      </div>
      <footer class="presentation-footer">
        <span>Left / Right to navigate</span>
        <span>Esc to exit</span>
      </footer>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
